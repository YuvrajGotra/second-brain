# PostgreSQL 16 with the pgvector extension.
# Start:  docker compose up -d     Stop: docker compose down     Wipe data: docker compose down -v
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: second-brain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: secondbrain
      POSTGRES_DB: second_brain
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain -d second_brain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
